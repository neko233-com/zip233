name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          choco install nsis wixtoolset --yes --no-progress
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            throw "makensis.exe was not found under $nsis"
          }
          $wixBin = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) {
            throw "candle.exe was not found under $wixBin"
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: go run ./cmd/zip233-icons
      - run: go vet ./...
      - run: go test ./...
      - name: Build MSI + NSIS with WiX 3
        shell: pwsh
        run: .\scripts\build-msi.ps1 -Version "$env:GITHUB_REF_NAME"
      - name: Stage Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item target\release\zip233-windows-amd64.msi release-assets\
          Copy-Item target\release\zip233-windows-amd64.msi.sha256 release-assets\
          Copy-Item target\release\zip233-*-x64.msi release-assets\
          Copy-Item target\release\zip233-*-x64.msi.sha256 release-assets\
          Copy-Item target\release\zip233-windows-amd64-setup.exe release-assets\
          Copy-Item target\release\zip233-windows-amd64-setup.exe.sha256 release-assets\
          Copy-Item target\release\zip233-*-x64-setup.exe release-assets\
          Copy-Item target\release\zip233-*-x64-setup.exe.sha256 release-assets\
          Copy-Item target\release\bundle\nsis\*.exe release-assets\
          Copy-Item scripts\install.ps1 release-assets\
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: go run ./cmd/zip233-icons
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/zip233-pack
      - name: Stage macOS assets
        run: |
          mkdir -p release-assets
          cp target/release/bundle/macos/*.dmg release-assets/
          cp scripts/install.sh release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Package icon assets
        run: tar -czf release-assets/zip233-icons.tar.gz -C resources icons
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
