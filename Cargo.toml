[package]
name = "zip233"
version = "0.1.3"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
rdesktop-core = { version = "0.1.15", git = "https://github.com/neko233-com/rdesktop.git", rev = "46b31da1c5b84441816fe79868658d38e88a1d5d" }
rdesktop-webview = { version = "0.1.15", git = "https://github.com/neko233-com/rdesktop.git", rev = "46b31da1c5b84441816fe79868658d38e88a1d5d" }
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
unarc-rs = { version = "0.7.0", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "deflate64", "lzma", "ppmd", "zstd", "xz"] }
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
bzip2 = "0.6"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
sevenz-rust2 = { version = "0.24.0", features = ["compress"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = []
native-agent = ["rdesktop-webview/native-agent"]
