name: Build zip233 desktop packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: zip233-windows-x64
            files: target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact: zip233-macos
            files: target/release/bundle/macos/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:frontend
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test archive operations
        run: cargo test --lib
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          # Keep the CI packager on the last pre-OSMF WiX CLI release.
          dotnet tool install --global wix --version 5.0.2
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            throw "makensis.exe was not found under $nsis"
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append
          (Join-Path $env:USERPROFILE '.dotnet\tools') | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pinned rdesktop CLI
        run: cargo install --locked --git https://github.com/neko233-com/rdesktop.git --rev 46b31da1c5b84441816fe79868658d38e88a1d5d rdesktop-cli
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
