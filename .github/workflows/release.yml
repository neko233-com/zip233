name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          # Keep the release packager on the last pre-OSMF WiX CLI release.
          dotnet tool install --global wix --version 5.0.2
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            throw "makensis.exe was not found under $nsis"
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append
          "${env:USERPROFILE}\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pinned rdesktop bundler
        shell: pwsh
        run: cargo install --locked --git https://github.com/neko233-com/rdesktop.git --rev 46b31da1c5b84441816fe79868658d38e88a1d5d rdesktop-cli
      - name: Build Windows installers
        shell: pwsh
        run: |
          npm ci
          npm run build:frontend
          cargo fmt --all -- --check
          cargo test --lib
          npm run package
      - name: Stage Windows installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item target\release\bundle\nsis\*.exe release-assets\
          Copy-Item target\release\bundle\msi\*.msi release-assets\
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned rdesktop bundler
        run: cargo install --locked --git https://github.com/neko233-com/rdesktop.git --rev 46b31da1c5b84441816fe79868658d38e88a1d5d rdesktop-cli
      - name: Build macOS app and disk image
        run: |
          npm ci
          npm run build:frontend
          cargo fmt --all -- --check
          cargo test --lib
          npm run package
      - name: Stage macOS disk image
        run: |
          mkdir -p release-assets
          cp target/release/bundle/macos/*.dmg release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
